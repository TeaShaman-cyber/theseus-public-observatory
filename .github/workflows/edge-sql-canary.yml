name: Edge SQL research canary
on:
  pull_request:
    paths:
      - 'experiments/edge-sql/**'
      - '.github/workflows/edge-sql-canary.yml'
  workflow_dispatch:
concurrency:
  group: edge-sql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Prepare pinned native reference
        run: |
          python -m pip install duckdb==1.4.3
          python experiments/edge-sql/prepare.py tmp/edge-sql
      - name: Run isolated Workers emulation
        run: |
          npm ci --prefix experiments/edge-sql --ignore-scripts --no-audit --no-fund
          node experiments/edge-sql/canary.mjs tmp/edge-sql
