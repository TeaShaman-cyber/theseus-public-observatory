name: Verify Wolfram MCP claims

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-wolfram.yml"
      - "verification/claim-graph.json"
      - "verification/compilence-audit-claim-graph.json"
      - "verification/audits/**"
      - "verification/claims/**"
      - "verification/wolfram/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run existing observatory checks
        run: npm test

      - name: Install pinned MCP client
        run: npm ci --prefix verification/wolfram

      - name: Test verifier and claim graph guards
        run: node --test verification/wolfram/verify.test.mjs

      - name: Verify historical TID threshold arithmetic through Wolfram MCP
        run: node verification/wolfram/verify.mjs verification/claims/tid-navier-stokes-threshold.json verification/receipts/tid-navier-stokes-threshold.json

      - name: Verify historical TID ODE blow-up time through Wolfram MCP
        run: node verification/wolfram/verify.mjs verification/claims/tid-ode-blowup-time.json verification/receipts/tid-ode-blowup-time.json

      - name: Validate claim graph against generated receipts
        run: node verification/wolfram/verify-graph.mjs verification/claim-graph.json verification/receipts/claim-graph.json

      - name: Verify Compilence authority tier-lock claim through Wolfram MCP
        run: node verification/wolfram/verify.mjs verification/claims/compilence-tier-lock.json verification/receipts/compilence-tier-lock.json

      - name: Verify Compilence frozen-VAR stationarity claim through Wolfram MCP
        run: node verification/wolfram/verify.mjs verification/claims/compilence-stationarity-freeze.json verification/receipts/compilence-stationarity-freeze.json

      - name: Verify Compilence rank-deficit refusal claim through Wolfram MCP
        run: node verification/wolfram/verify.mjs verification/claims/compilence-rank-deficit.json verification/receipts/compilence-rank-deficit.json

      - name: Validate Compilence public-math audit graph
        run: node verification/wolfram/verify-graph.mjs verification/compilence-audit-claim-graph.json verification/receipts/compilence-audit-claim-graph.json

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolfram-verification-receipts
          path: verification/receipts/*.json
          if-no-files-found: warn
          retention-days: 30
