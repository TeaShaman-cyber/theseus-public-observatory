name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            observatory_site/requirements.txt
            observatory_site/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r observatory_site/requirements.txt -r observatory_site/requirements-dev.txt

      - name: Test repository and site
        run: bash tools/dev/check

      - name: Rebuild disposable research index
        run: python scripts/build-observatory-index.py --repo-root . --output data/index/observatory.duckdb

      - name: Build historical archive-pack canary
        run: |
          python scripts/build_archive_pack.py build --repo-root . --period 2026-09 --output-dir /tmp/observatory-data-2026-09
          python scripts/build_archive_pack.py verify --pack-dir /tmp/observatory-data-2026-09

      - name: Build static site
        run: python -m observatory_site.build --repo-root . --output public --base-path /theseus-public-observatory/

      - name: Verify canonical sources unchanged
        run: git diff --exit-code -- data reports docs/methodology.md experiments/public

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      "id-token": write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
