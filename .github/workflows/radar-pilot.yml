name: Cloudflare Radar schema pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Offline contract tests
        run: python -m unittest scripts.test_radar_pilot -v
      - name: Collect bounded schema evidence
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
        run: python -m scripts.radar_pilot --output tmp/radar-pilot/receipt.json
      - name: Retain sanitized pilot receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/radar-pilot/receipt.json
          if-no-files-found: error
          retention-days: 7
