name: Collect public observatory data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions: {}

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Collect public status data
        id: collect
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
        run: |
          npm run collect
          cp data/latest/public-status.json "$RUNNER_TEMP/observatory-snapshot.json"

      - name: Validate public data
        run: npm test

      - name: Commit public snapshots
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          node scripts/publish-collection.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/observatory-snapshot.json"

      - name: Preserve unpublished snapshot for recovery
        if: failure() && steps.collect.outcome == 'success' && steps.publish.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observatory-snapshot.json
          retention-days: 7
          if-no-files-found: error

      - name: Check sensor contracts
        run: npm run sensor-health-check
