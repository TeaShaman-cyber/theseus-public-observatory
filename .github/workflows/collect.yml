name: Collect public observatory data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions: {}

jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Collect public status data
        run: npm run collect

      - name: Validate public data
        run: npm test

      - name: Commit public snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No public snapshot changes to commit."
          else
            git commit -m "Collect public observatory data"
            gh auth setup-git --hostname github.com
            git push
          fi

      - name: Check sensor contracts
        run: npm run sensor-health-check
