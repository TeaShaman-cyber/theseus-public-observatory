name: TID root pilot - GW150914

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tid-root-ligo-pilot
    paths:
      - ".github/workflows/tid-root-ligo.yml"
      - "experiments/tid_root/**"
      - "tests/test_tid_*.py"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/tid_root/requirements.txt

      - name: Install scientific stack
        run: pip install -r experiments/tid_root/requirements.txt

      - name: Test measurement contract
        run: python -m unittest tests/test_tid_ligo.py tests/test_tid_features.py

      - name: Run GW150914 root pilot
        run: python experiments/tid_root/run_ligo_analysis.py --out-dir artifacts/gw150914-root-v0.1

      - name: Validate artifacts
        run: |
          python -m json.tool artifacts/gw150914-root-v0.1/manifest.json >/dev/null
          python -m json.tool artifacts/gw150914-root-v0.1/features.json >/dev/null
          python -m json.tool artifacts/gw150914-root-v0.1/summary.json >/dev/null
          sha256sum artifacts/gw150914-root-v0.1/*.json > artifacts/gw150914-root-v0.1/SHA256SUMS

      - name: Upload compact results
        uses: actions/upload-artifact@v4
        with:
          name: gw150914-root-v0.1
          path: |
            artifacts/gw150914-root-v0.1/manifest.json
            artifacts/gw150914-root-v0.1/features.json
            artifacts/gw150914-root-v0.1/summary.json
            artifacts/gw150914-root-v0.1/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
