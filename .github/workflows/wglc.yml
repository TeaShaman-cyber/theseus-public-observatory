name: WGLC HDF5 validation
on:
  pull_request:
    paths:
      - 'scripts/wglc_read.py'
      - 'scripts/remote_zip.py'
      - 'experiments/wglc/**'
      - '.github/workflows/wglc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hdf5-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=:all: -r experiments/wglc/requirements.txt
      - run: python -m unittest discover -s experiments/wglc -v
